# Runs on every pull request: typecheck, lint with inline annotations, tests with coverage.
# Results go to the job summary (Checks tab) and, for branches in this repository, a sticky PR comment.
# Pull requests from forks get the summary and annotations only, because their token cannot comment.
name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint (inline annotations)
        id: lint
        continue-on-error: true
        run: npx oxlint src --format github

      - name: Tests with coverage
        id: tests
        continue-on-error: true
        run: npm run test:coverage -- --coverage.reporter=json-summary --coverage.reporter=text

      - name: Write summary
        id: summary
        shell: bash
        run: |
          status() { if [ "$1" = "success" ]; then echo "pass"; else echo "FAIL"; fi; }
          coverage="n/a"
          if [ -f coverage/coverage-summary.json ]; then
            coverage=$(node -e "const s=require('./coverage/coverage-summary.json').total; console.log(['lines','statements','branches','functions'].map(k=>k+' '+s[k].pct+'%').join(', '))")
          fi
          {
            echo "## PR checks"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Typecheck | $(status ${{ steps.typecheck.outcome }}) |"
            echo "| Lint | $(status ${{ steps.lint.outcome }}) |"
            echo "| Tests | $(status ${{ steps.tests.outcome }}) |"
            echo "| Coverage | $coverage |"
            echo ""
            echo "Lint findings, if any, are annotated inline in the Files tab. Full logs are in this workflow run."
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- pr-checks -->'
            const body = marker + '\n' + fs.readFileSync('summary.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(marker))
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Fail the job if any check failed
        if: ${{ steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success' || steps.tests.outcome != 'success' }}
        run: exit 1
